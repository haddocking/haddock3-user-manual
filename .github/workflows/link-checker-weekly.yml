name: links (full project, weekly)

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * 1"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: -q './**/*.md' --accept 200..299,403,502
