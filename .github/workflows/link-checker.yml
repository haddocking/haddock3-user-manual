name: links (changed files)

on:
  pull_request:

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed markdown files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: "**/*.md"

      - name: Link Checker
        id: lychee
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: -q ${{ steps.changed-files.outputs.all_changed_files }} --accept 200..299,403,502
